<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>standings layout harness</title>
<style>
  body { margin:0; padding:16px; background:#E5E7EB; font:12px/1.4 sans-serif; color:#111827; }
  .row { display:flex; gap:20px; align-items:flex-start; margin-bottom:24px; }
  figure { margin:0; }
  figcaption { font-weight:700; margin-bottom:6px; }
  iframe { border:0; background:#fff; display:block; box-shadow:0 2px 10px rgba(0,0,0,.15); }
</style></head>
<body>
  <div class="row">
    <figure><figcaption>390 · 팀 순위 EPL</figcaption>
      <iframe src="../standings.html#EPL" width="390" height="1150"></iframe></figure>
    <figure><figcaption>320 · 팀 순위 EPL</figcaption>
      <iframe src="../standings.html#EPL" width="320" height="1150"></iframe></figure>
  </div>
  <div class="row">
    <figure><figcaption>390 · 개인 순위 EPL</figcaption>
      <iframe src="../standings.html#EPL/player" width="390" height="2350"></iframe></figure>
    <figure><figcaption>320 · 개인 순위 EPL</figcaption>
      <iframe src="../standings.html#EPL/player" width="320" height="2350"></iframe></figure>
  </div>
  <div class="row">
    <figure><figcaption>390 · 팀 순위 NBA</figcaption>
      <iframe src="../standings.html#NBA" width="390" height="1250"></iframe></figure>
    <figure><figcaption>320 · 개인 순위 NBA</figcaption>
      <iframe src="../standings.html#NBA/player" width="320" height="3000"></iframe></figure>
  </div>
</body></html>
