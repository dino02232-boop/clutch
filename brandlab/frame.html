<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>frame</title>
<style>html,body{margin:0;padding:0;background:#fff}iframe{border:0;display:block}</style>
</head><body>
<script>
var q = new URLSearchParams(location.search);
var src = q.get("src") || "index.html";
var w = parseInt(q.get("w") || "390", 10);
var h = parseInt(q.get("h") || "1400", 10);
var f = document.createElement("iframe");
f.src = src; f.width = w; f.height = h; f.scrolling = "no";
document.body.appendChild(f);
</script>
</body></html>
