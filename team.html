<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<title>VERSUS — 팀 페이지</title>
<meta name="description" content="팀 하나의 최근 전적·최근 5경기·경기 일정·주요 선수를 경기 데이터로 정리합니다.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=20261122-vs2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261122-vs2">
<link rel="stylesheet" href="styles.css?v=20261122-cmp2">
<style>
/* 팀 페이지 전용 배치 — styles.css 는 건드리지 않고 이 페이지만의 클래스만 여기에 둡니다.
   390px 기준, 320px 에서도 가로 넘침이 없도록 flex/grid 는 minmax(0,1fr) + 말줄임을 씁니다. */
.tp-main { padding: 12px var(--pad) 0; }

.tp-back {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 800; color: var(--text-2); text-decoration: none;
  padding: 5px 9px; border-radius: 9px; background: rgba(17, 24, 39, .05);
}
.tp-back:hover { background: rgba(17, 24, 39, .08); }

.tp-head { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; }
.tp-head .tp-name { margin: 0; }
.tp-name {
  margin: 12px 0 0; font-size: 22px; font-weight: 800; line-height: 1.24;
  letter-spacing: -.035em; word-break: keep-all; overflow-wrap: anywhere;
}
.tp-sub { margin: 6px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }

.tp-chip {
  font-size: 10px; font-weight: 700; letter-spacing: .01em; line-height: 1.6;
  padding: 1px 6px; border-radius: 5px; color: var(--text-2);
  background: rgba(17, 24, 39, .055); white-space: nowrap;
}
.tp-chip.sport { color: #FFFFFF; background: #111827; font-weight: 800; }
.tp-chip.rank { color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(14, 159, 110, .24); }
.tp-chip.plain { color: var(--text-3); background: rgba(17, 24, 39, .04); }

.tp-sec { margin: 18px 0 0; }
.tp-h {
  display: flex; align-items: center; gap: 6px; margin: 0 0 7px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: var(--text-3);
}
.tp-h .n { color: var(--warn); font-variant-numeric: tabular-nums; }
.tp-card {
  border: 1px solid var(--line); border-radius: 15px; background: var(--card);
  padding: 12px; box-shadow: 0 1px 2px rgba(17, 24, 39, .03);
}

/* 전적 요약 */
.tp-rec { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.tp-rec b { font-size: 20px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tp-formrow {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 9px; border-top: 1px dashed rgba(17, 24, 39, .07);
}
.tp-lb { font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--text-3); }
.tp-form { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 900; line-height: 1.2; }
.tp-l5 { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tp-hint { font-size: 9.5px; color: var(--text-3); }

/* 시즌 지표 */
.tp-kv {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin: 0;
}
.tp-kv > div { display: flex; align-items: baseline; justify-content: space-between; gap: 5px; min-width: 0; }
.tp-kv dt { flex: 0 0 auto; font-size: 10px; font-weight: 700; color: var(--text-3); white-space: nowrap; }
.tp-kv dd {
  margin: 0; min-width: 0; font-size: 11.5px; font-weight: 700; color: #1F2937; text-align: right;
  font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.tp-kv .wide { grid-column: 1 / -1; }

/* 경기 일정 */
.tp-games { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tp-games > li {
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
  padding: 10px 0; border-bottom: 1px dashed rgba(17, 24, 39, .07);
}
.tp-games > li:first-child { padding-top: 2px; }
.tp-games > li:last-child { border-bottom: 0; padding-bottom: 2px; }
.tp-gtop { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tp-state {
  flex: 0 0 auto; font-size: 9px; font-weight: 800; letter-spacing: .03em; line-height: 1.6;
  padding: 1px 5px; border-radius: 5px; color: var(--text-3); background: rgba(17, 24, 39, .06);
}
.tp-state.final { color: var(--text-2); }
.tp-state.live { color: #FFFFFF; background: #DC2626; }
.tp-state.next { color: var(--accent); background: var(--accent-dim); }
.tp-when {
  font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.tp-league { flex: 0 0 auto; margin-left: auto; font-size: 9.5px; color: var(--text-3); white-space: nowrap; }
.tp-gmid { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tp-ha {
  flex: 0 0 auto; font-size: 9px; font-weight: 800; line-height: 1.6; padding: 1px 5px; border-radius: 4px;
  color: var(--text-3); background: rgba(17, 24, 39, .05);
}
.tp-ha.home { color: var(--accent); background: var(--accent-dim); }
.tp-opp {
  min-width: 0; font-size: 13px; font-weight: 700; color: #111827;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tp-score {
  flex: 0 0 auto; margin-left: auto; font-size: 12.5px; font-weight: 800;
  font-variant-numeric: tabular-nums; color: #111827;
}
.tp-score.win { color: #0B7A54; }
.tp-score.loss { color: #DC2626; }
.tp-score.draw { color: #111827; }
.tp-odds { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.tp-odlab { font-size: 9.5px; font-weight: 800; letter-spacing: .03em; color: var(--text-3); }
.tp-od {
  font-size: 9.5px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.6;
  padding: 1px 5px; border-radius: 5px; color: var(--text-2); background: rgba(17, 24, 39, .045);
}
.tp-od i { font-style: normal; font-weight: 700; color: var(--text-3); margin-right: 3px; }
.tp-od.own { color: var(--accent); background: var(--accent-dim); }
.tp-od.own i { color: var(--accent); }
.tp-odprov { font-size: 9px; color: var(--text-3); }

/* 선수 */
.tp-players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.tp-players > li {
  min-width: 0; padding: 8px 9px; border-radius: 10px; background: rgba(17, 24, 39, .028);
  border: 1px solid rgba(17, 24, 39, .05); display: flex; gap: 9px; align-items: flex-start;
}
.tp-players .pl-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tp-players .pl-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.tp-players .pl-top b {
  min-width: 0; font-size: 12.5px; font-weight: 800; color: #111827;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tp-players .pl-pos { flex: 0 0 auto; }
.tp-statline { font-size: 11.5px; font-weight: 700; color: #374151; font-variant-numeric: tabular-nums; }

.tp-inj-nm { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12.5px; font-weight: 700; color: #1F2937; }
.tp-inj-nm .pl-pos { flex: 0 0 auto; }

.tp-note { margin: 16px 0 0; font-size: 10.5px; line-height: 1.6; color: var(--text-3); }

/* 데이터 없음 / 팀 못 찾음 */
.tp-empty { text-align: center; padding: 40px 20px 34px; border: 1px dashed rgba(17, 24, 39, .13); border-radius: var(--radius); background: rgba(17, 24, 39, .014); margin-top: 16px; }
.tp-empty .ico { display: block; font-size: 26px; margin-bottom: 12px; opacity: .9; }
.tp-empty h2 { margin: 0 0 7px; font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
.tp-empty p { margin: 0 auto; max-width: 280px; font-size: 12.5px; line-height: 1.65; color: var(--text-3); }
.tp-empty a { display: inline-block; margin-top: 16px; padding: 10px 16px; border-radius: 11px; background: #111827; color: #FFFFFF; font-size: 12px; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-row">
      <a class="brand" href="index.html" aria-label="VERSUS — 오늘의 매치업으로 이동">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand-txt">
          <span class="brand-name" aria-hidden="true"><span class="bn-v">V</span><span class="bn-rest">ERSUS</span></span>
          <span class="brand-sub">팀 페이지 · 최근 흐름과 일정</span>
        </span>
      </a>
      <div class="brand-date">
        <b id="tpDataDate">—</b>
        데이터 기준
      </div>
    </div>
  </header>

  <main class="tp-main">
    <div id="team" aria-live="polite"></div>

    <footer class="foot">
      <p class="strong">팀 페이지는 경기 카드가 담고 있는 값만 모아 보여 줍니다. 없는 항목은 비워 둡니다.</p>
      <p>전적·일정은 <code>data.js</code> 의 값 그대로이며, 경기 시작 시각과 출전 명단은 현지 공식 발표로 다시 확인하세요.</p>
    </footer>
  </main>
</div>

<script src="data.js?v=20261122-pos1"></script>
<script src="team-logos.js?v=20261121-crest3"></script>
<script src="team.js?v=20261121-crest3"></script>
</body>
</html>
